<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLB Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #ui {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 400px;
        }
        
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <div class="spinner"></div>
            <h2>Loading Soccer Game...</h2>
            <p>Please wait while we load your character</p>
        </div>
        
        <div id="ui">
            <h3>⚽ Soccer Quiz Game</h3>
            <div id="quizContainer" style="margin-top: 15px;">
                <div id="questionDisplay" style="background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; margin-bottom: 10px;">
                    <h4 id="questionText">Click "Start Quiz" to begin!</h4>
                    <div id="answerButtons" style="margin-top: 10px;"></div>
                </div>
                <button id="startQuiz" style="padding: 8px 16px; background: #FF9800; color: white; border: none; border-radius: 5px; cursor: pointer;">Start Quiz</button>
                <div id="scoreDisplay" style="margin-top: 10px; font-size: 14px;">
                    Score: <span id="score">0</span> | Question: <span id="questionNumber">0</span>/<span id="totalQuestions">0</span>
                </div>
            </div>
            <button id="testSound" style="margin-top: 10px; padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">Test Sound</button>
            <button id="loadSound" style="margin-top: 5px; padding: 8px 16px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">Load Sound</button>
        </div>
        
    </div>

    <!-- Three.js CDN - Using ES6 modules for better reliability -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Load the game as an ES6 module -->
    <script type="module" src="game.js?v=1761340800000"></script>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
</body>
</html>
