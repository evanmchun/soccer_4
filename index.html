<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Quiz Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #ui {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 380px;
            width: calc(30vw + 150px);
            max-height: 85vh;
            min-height: 450px;
            overflow-y: auto;
        }
        
        /* Make UI even more compact when embedded in iframe */
        .embedded #ui {
            max-width: 300px;
            width: calc(35vw + 100px);
            max-height: 75vh;
            min-height: 400px;
            padding: 12px;
            right: 10px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1200px) {
            #ui {
                max-width: 320px;
                padding: 12px;
            }
        }
        
        @media (max-width: 768px) {
            #ui {
                max-width: 280px;
                padding: 10px;
                right: 10px;
            }
        }
        
        #shoeIcon {
            position: absolute;
            bottom: 20px;
            right: 100px;
            width: 60px;
            height: 60px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            padding: 10px;
            backdrop-filter: blur(5px);
        }
        
        #questionCounter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        #scoreDisplay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        #musicToggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }
        
        #musicToggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }
        
        #musicToggle.playing {
            background: rgba(156, 39, 176, 0.5);
        }
        
        /* Detect if in iframe and apply embedded class */
    </style>
    <script>
        // Check if running in iframe
        if (window.self !== window.top) {
            document.body.classList.add('embedded');
        }
    </script>
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <div class="spinner"></div>
            <h2>Loading Soccer Game...</h2>
            <p>Please wait while we load your character</p>
        </div>
        
        <div id="ui">
            <h3 style="margin: 0 0 10px 0; font-size: 16px;">⚽ Soccer Quiz Game</h3>
            <div id="quizContainer" style="margin-top: 10px;">
                <div id="questionDisplay" style="background: rgba(0,0,0,0.7); padding: 8px; border-radius: 5px; margin-bottom: 8px;">
                    <h4 id="questionText" style="margin: 0 0 8px 0; font-size: 14px; line-height: 1.4;">Click "Start Quiz" to begin!</h4>
                    <div id="answerButtons" style="margin-top: 8px;"></div>
                </div>
                <button id="startQuiz" style="padding: 10px 16px; background: #FF9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: 500;">Start Quiz</button>
            </div>
        </div>
        
        <div id="shoeIcon">
            <img src="Images/icon_shoe.svg" alt="Soccer Shoe Icon" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        
        <div id="questionCounter">
            <span id="currentQuestion">0</span>/<span id="totalQuestionsCounter">5</span>
        </div>
        
        <div id="scoreDisplay">
            SCORE: <span id="topScore">0</span>
        </div>
        
        <button id="musicToggle">🎵 Play Music</button>
        
    </div>

    <!-- Three.js CDN - Using ES6 modules for better reliability -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Load the game as an ES6 module -->
    <script type="module" src="game.js?v=1761340800000"></script>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
</body>
</html>
